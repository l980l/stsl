<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 28" width="60" height="28">
  <!-- 측면(우향) 새: 좌측 꼬리 → 우측 머리/부리. scale.x = -1 로 좌향 flip -->
  <!-- 몸통 (가로 타원) -->
  <ellipse cx="32" cy="16" rx="14" ry="5" fill="#1a1a22"/>
  <!-- 꼬리 (좌측 끝) -->
  <path d="M 18 16 L 6 12 L 8 18 Z" fill="#1a1a22"/>
  <!-- 머리 (우측, 약간 위) -->
  <circle cx="46" cy="13" r="5" fill="#1a1a22"/>
  <!-- 부리 (우측 끝) -->
  <path d="M 50 12 L 56 13 L 50 15 Z" fill="#3a2a18"/>
  <!-- 눈 (작은 흰점) -->
  <circle cx="47" cy="12" r="0.8" fill="#fff" opacity="0.6"/>
  <!-- 날개 (윗쪽) — 펄럭이는 위쪽 V -->
  <path d="M 24 14 Q 30 4 38 14 Z" fill="#0e0e16"/>
  <!-- 날개 그림자 (아래쪽 작은) -->
  <path d="M 26 17 Q 32 22 38 17 Z" fill="#0a0a12" opacity="0.7"/>
</svg>
