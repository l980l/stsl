  <rect x="70" y="280" width="60" height="8" fill="#d8a040"/>
  <rect x="70" y="288" width="60" height="3" fill="#3a1808"/>
  <rect x="70" y="410" width="60" height="8" fill="#d8a040"/>
  <rect x="70" y="418" width="60" height="3" fill="#3a1808"/>
  <!-- 위쪽 캡 (목조 처마 받침) -->
  <rect x="55" y="90" width="90" height="14" fill="#503020"/>
  <rect x="50" y="80" width="100" height="12" fill="#603020"/>
  <rect x="50" y="78" width="100" height="4" fill="#a04020"/>
