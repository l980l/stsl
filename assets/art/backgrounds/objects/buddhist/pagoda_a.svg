  <ellipse cx="155" cy="320" rx="8" ry="3" fill="#3a1808"/>
  <ellipse cx="445" cy="320" rx="8" ry="3" fill="#3a1808"/>
  <!-- 2층 -->
  <rect x="210" y="220" width="180" height="80" fill="url(#pga_wall)"/>
  <rect x="290" y="245" width="20" height="55" fill="#3a1808"/>
