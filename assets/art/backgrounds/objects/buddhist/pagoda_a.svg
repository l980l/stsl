      <stop offset="0" stop-color="#8a3818"/>
      <stop offset="1" stop-color="#4a1808"/>
    </linearGradient>
    <linearGradient id="pga_wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8b878"/>
      <stop offset="1" stop-color="#705028"/>
    </linearGradient>
  </defs>
  <!-- 받침 단 -->
  <rect x="150" y="420" width="300" height="40" fill="#605040"/>
  <rect x="150" y="420" width="300" height="6" fill="#8a7860"/>
