  <rect x="295" y="60" width="10" height="60" fill="#5a3020"/>
  <circle cx="300" cy="55" r="6" fill="#d8a040"/>
  <circle cx="300" cy="40" r="4" fill="#d8a040"/>
  <!-- 단청 패턴 (1층 벽) -->
  <line x1="180" y1="350" x2="280" y2="350" stroke="#3a1808" stroke-width="2" opacity="0.4"/>
  <line x1="320" y1="350" x2="420" y2="350" stroke="#3a1808" stroke-width="2" opacity="0.4"/>
