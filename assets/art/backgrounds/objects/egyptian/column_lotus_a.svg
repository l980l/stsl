      <stop offset="1" stop-color="#603818"/>
    </linearGradient>
    <linearGradient id="cla_cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#88a850"/>
      <stop offset="1" stop-color="#506830"/>
