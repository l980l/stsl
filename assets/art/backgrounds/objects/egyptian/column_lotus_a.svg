  <path d="M 65 560 Q 70 280 75 130 L 125 130 Q 130 280 135 560 Z" fill="url(#cla_stone)"/>
  <!-- 상형문자 줄 -->
  <line x1="85" y1="200" x2="115" y2="200" stroke="#1a1008" stroke-width="2"/>
  <line x1="85" y1="220" x2="115" y2="220" stroke="#1a1008" stroke-width="2"/>
  <line x1="90" y1="280" x2="110" y2="280" stroke="#1a1008" stroke-width="2"/>
  <circle cx="100" cy="310" r="3" fill="#1a1008"/>
