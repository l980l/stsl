  </defs>
  <ellipse cx="100" cy="588" rx="80" ry="10" fill="#000" opacity="0.5"/>
  <!-- 받침 -->
  <rect x="40" y="560" width="120" height="30" fill="#785030"/>
  <rect x="40" y="560" width="120" height="6" fill="#a08048"/>
