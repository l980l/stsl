  <line x1="85" y1="440" x2="115" y2="440" stroke="#1a1008" stroke-width="2"/>
  <!-- 연꽃 캡 (위쪽) -->
  <path d="M 60 130 Q 100 80 140 130 Q 130 110 100 100 Q 70 110 60 130 Z" fill="url(#cla_cap)"/>
  <!-- 연꽃 잎 (벌어진 모양) -->
