<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 36 580 418" width="580" height="418">
  <defs>
    <linearGradient id="pya_stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0b870"/>
      <stop offset="1" stop-color="#785028"/>
    </linearGradient>
    <linearGradient id="pya_shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a2010" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- 모래 받침 -->
  <ellipse cx="300" cy="440" rx="290" ry="14" fill="#9a7848" opacity="0.55"/>
  <!-- 피라미드 본체 (삼각형) -->
  <path d="M 80 440 L 300 40 L 520 440 Z" fill="url(#pya_stone)"/>
  <!-- 그림자 면 (오른쪽) -->
  <path d="M 300 40 L 520 440 L 300 440 Z" fill="url(#pya_shade)"/>
  <!-- 블록 라인 (수평) -->
  <line x1="160" y1="280" x2="440" y2="280" stroke="#5a3818" stroke-width="2" opacity="0.4"/>
  <line x1="130" y1="350" x2="470" y2="350" stroke="#5a3818" stroke-width="2" opacity="0.4"/>
  <line x1="200" y1="200" x2="400" y2="200" stroke="#5a3818" stroke-width="2" opacity="0.4"/>
  <line x1="240" y1="120" x2="360" y2="120" stroke="#5a3818" stroke-width="2" opacity="0.4"/>
  <!-- 꼭대기 -->
  <circle cx="300" cy="40" r="4" fill="#fff8d8"/>
  <!-- 작은 입구 -->
  <rect x="288" y="400" width="24" height="40" fill="#1a1008"/>
  <rect x="288" y="400" width="24" height="6" fill="#3a2418"/>
</svg>
