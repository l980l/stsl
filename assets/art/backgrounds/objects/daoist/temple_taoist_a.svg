  <path d="M 110 270 Q 80 260 70 280 Q 90 275 115 272 Z" fill="url(#tta_roof)"/>
  <path d="M 490 270 Q 520 260 530 280 Q 510 275 485 272 Z" fill="url(#tta_roof)"/>
  <!-- 첨탑 -->
  <rect x="295" y="160" width="10" height="44" fill="#3a2818"/>
  <circle cx="300" cy="155" r="6" fill="#d8a040"/>
  <circle cx="300" cy="140" r="3" fill="#d8a040"/>
  <!-- 도교 문양 (단청) - 처마 가운데 -->
  <rect x="285" y="240" width="30" height="14" fill="#a07020"/>
  <circle cx="300" cy="247" r="5" fill="#d8a040"/>
</svg>
