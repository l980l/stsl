<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 531 461" width="531" height="461">
  <defs>
    <linearGradient id="tta_roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1208"/>
      <stop offset="1" stop-color="#0a0604"/>
    </linearGradient>
    <linearGradient id="tta_wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#503820"/>
      <stop offset="1" stop-color="#2a1810"/>
    </linearGradient>
  </defs>
  <!-- 받침 단 -->
  <rect x="100" y="420" width="400" height="40" fill="#3a2818"/>
  <rect x="100" y="420" width="400" height="6" fill="#604028"/>
  <!-- 본채 -->
  <rect x="140" y="270" width="320" height="155" fill="url(#tta_wall)"/>
  <!-- 중앙 문 + 금색 음양 문양 -->
  <rect x="270" y="310" width="60" height="115" fill="#0a0604"/>
  <rect x="270" y="310" width="60" height="6" fill="#3a2418"/>
  <circle cx="300" cy="350" r="14" fill="none" stroke="#d8a040" stroke-width="2"/>
  <path d="M 300 336 A 7 7 0 0 1 300 350 A 7 7 0 0 0 300 364" stroke="#d8a040" stroke-width="2" fill="none"/>
  <circle cx="300" cy="343" r="2" fill="#d8a040"/>
  <circle cx="300" cy="357" r="2" fill="#0a0604"/>
  <!-- 격자 창 (양쪽) -->
  <rect x="170" y="310" width="60" height="50" fill="#0a0604"/>
  <line x1="170" y1="335" x2="230" y2="335" stroke="#604028" stroke-width="1.5"/>
  <line x1="200" y1="310" x2="200" y2="360" stroke="#604028" stroke-width="1.5"/>
  <rect x="370" y="310" width="60" height="50" fill="#0a0604"/>
  <line x1="370" y1="335" x2="430" y2="335" stroke="#604028" stroke-width="1.5"/>
  <line x1="400" y1="310" x2="400" y2="360" stroke="#604028" stroke-width="1.5"/>
  <!-- 검은 처마 (휘어진 곡선) -->
  <path d="M 110 270 L 300 200 L 490 270 L 470 270 L 300 220 L 130 270 Z" fill="url(#tta_roof)"/>
  <rect x="110" y="252" width="380" height="20" fill="url(#tta_roof)"/>
