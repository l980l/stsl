<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="sj-bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0a1a2e"/>
      <stop offset="100%" stop-color="#03070e"/>
    </radialGradient>
  </defs>
  <circle cx="128" cy="128" r="112" fill="url(#sj-bg)" stroke="#c9a84c" stroke-width="7"/>
  <!-- 도리이 (鳥居) — 결계의 문 -->
  <!-- 가사기 (위 가로보) — 양 끝 살짝 위로 -->
  <path d="M 36,72 Q 128,58 220,72 L 215,84 Q 128,72 41,84 Z"
        fill="#cc3322" stroke="#c9a84c" stroke-width="3"/>
  <!-- 시마기 (두번째 가로보) -->
  <rect x="56" y="92" width="144" height="14" fill="#cc3322" stroke="#c9a84c" stroke-width="3"/>
  <!-- 가쿠즈카 (가운데 세로) -->
  <rect x="122" y="106" width="12" height="20" fill="#cc3322" stroke="#c9a84c" stroke-width="2"/>
  <!-- 좌 기둥 -->
  <path d="M 70,72 L 76,210 L 60,210 L 64,72 Z"
        fill="#cc3322" stroke="#c9a84c" stroke-width="3"/>
  <!-- 우 기둥 -->
  <path d="M 186,72 L 180,210 L 196,210 L 192,72 Z"
        fill="#cc3322" stroke="#c9a84c" stroke-width="3"/>
  <!-- 결계 (푸른 보호막) — 도리이 내부 -->
  <path d="M 80,126 Q 128,150 176,126 Q 176,180 128,200 Q 80,180 80,126 Z"
        fill="#4db3ff" stroke="#80d0ff" stroke-width="2" opacity="0.35"/>
  <!-- 결계 문양 (만지) -->
  <circle cx="128" cy="160" r="14" fill="none" stroke="#4db3ff" stroke-width="2.5" opacity="0.8"/>
  <circle cx="128" cy="160" r="22" fill="none" stroke="#4db3ff" stroke-width="2" opacity="0.5"/>
</svg>
