<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="mark-glow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="mark-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5555"/>
      <stop offset="100%" stop-color="#660000"/>
    </radialGradient>
  </defs>

  <!-- 외곽 링 -->
  <circle cx="128" cy="128" r="112" fill="#080c18" stroke="#c9a84c" stroke-width="7"/>

  <!-- 표적 동심원 (붉은 / 흰 교대) -->
  <circle cx="128" cy="128" r="86" fill="none" stroke="#ee2222" stroke-width="6" filter="url(#mark-glow)"/>
  <circle cx="128" cy="128" r="68" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.85"/>
  <circle cx="128" cy="128" r="48" fill="none" stroke="#ee2222" stroke-width="5"/>
  <circle cx="128" cy="128" r="28" fill="url(#mark-grad)" stroke="#c9a84c" stroke-width="3"/>

  <!-- 십자선 -->
  <line x1="20" y1="128" x2="80" y2="128" stroke="#ffeeaa" stroke-width="4" stroke-linecap="round" filter="url(#mark-glow)"/>
  <line x1="176" y1="128" x2="236" y2="128" stroke="#ffeeaa" stroke-width="4" stroke-linecap="round" filter="url(#mark-glow)"/>
  <line x1="128" y1="20" x2="128" y2="80" stroke="#ffeeaa" stroke-width="4" stroke-linecap="round" filter="url(#mark-glow)"/>
  <line x1="128" y1="176" x2="128" y2="236" stroke="#ffeeaa" stroke-width="4" stroke-linecap="round" filter="url(#mark-glow)"/>

  <!-- 중앙 점 -->
  <circle cx="128" cy="128" r="8" fill="#ffffff" filter="url(#mark-glow)"/>
</svg>
