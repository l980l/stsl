  <!-- 음 (어두운 절반) -->
  <path d="M 128,52 A 76,76 0 0 0 128,204 A 38,38 0 0 0 128,128 A 38,38 0 0 1 128,52 Z"
        fill="#1c2838" stroke="#c9a84c" stroke-width="4"/>
